# fs-linux-test-harness consumer config (see ../fs-linux-test-harness/README.md).
#
# EVERYTHING THAT IS LINUX HAPPENS IN HERE. The fixtures, which need the
# real kernel to populate them — subvolumes, snapshots, extended
# attributes, `chattr +C`, a compressing mount, a two-device pool; every
# oracle tool (mkfs.btrfs, btrfs check, btrfs inspect-internal), because
# btrfs-progs on a workstation is whatever that machine has and on a Mac
# is not the platform these images are for; the kernel oracles, which
# loop-mount our images; and, on a host that is not Linux, the suite
# itself (`chore test:vm`).

[project]
name = "rust-fs-btrfs"

[setup]
# Runs as root INSIDE the VM; installs btrfs-progs, attr, e2fsprogs (for
# chattr), python3, and the toolchain the in-guest suite builds with.
script = "scripts/vm-setup.sh"

[test]
# Runs INSIDE the guest, from /repo (this repository, mounted there).
guest_command = "scripts/guest-suite.sh"

[share]
dir = ".vm-share"
