# fs-linux-test-harness consumer config for the Debian 13 guest (see
# ../fs-linux-test-harness/README.md, `[vm] guest`).
#
# A SECOND GUEST, NOT A SECOND SUITE. Every tier boots the Debian 12 guest
# fs-linux-test-harness.toml describes, whose kernel 6.1 cannot mount a
# simple-quota volume, so it can never have the kernel write the owner
# references a 6.7 or later kernel adds to each data extent (#455). This is
# the same config with its own machine name and SSH port and
# `[vm] guest = "debian-13"`, whose kernel is 6.12: `chore test:kernel-new`
# points the harness at it through FLTH_CONFIG, and the suites in
# scripts/test-targets.sh's kernel-new tier run there and nowhere else.
# A Mac has no Debian 13 guest; that tier runs on a Linux host, as CI's
# `test-kernel-new` job does.
#
[project]
name = "rust-fs-btrfs-deb13"

[setup]
# Runs as root INSIDE the VM; installs btrfs-progs, attr, e2fsprogs (for
# chattr), python3, and the toolchain the in-guest suite builds with.
script = "scripts/vm-setup.sh"

[test]
# Runs INSIDE the guest, from /repo (this repository, mounted there).
guest_command = "scripts/guest-suite.sh"

[share]
dir = ".vm-share"

[vm]
# EIGHT HOURS on the deadline, not two: the whole suite on a loaded
# arm64 host runs well past an hour — the populated fixtures alone fill
# two trees with eighty thousand files — and the guest's own poweroff
# does not care what is using it. A VM pulled out from under a running
# suite leaves every call it was serving with nothing to answer. The
# deadline is still what stops a VM nobody cleaned up; it just has to
# outlast a test run.
#
# 4G of memory, and a 32G disk because the fixture build is the heaviest
# in the family: two 2 GiB populated images, a 600 MiB compressing mount
# per algorithm, and a two-device pool, all on the guest's own disk
# before they are copied out.
#
# NOT MORE MEMORY. The guest fills a loop-mounted 2 GiB image with
# eighty thousand files, which is page cache the host has to find; on a
# 16 GB development machine an 8G guest doing that pushed the host into
# swap and the VM stopped answering SSH mid-build. The work is disk
# bound, not memory bound, and 4G is what the sibling consumers use.
memory = "4G"
cpus = 4
disk = "32G"
ssh_port = 50136
guest = "debian-13"
deadline_minutes = 480
