name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"
  # Pinned tag of the sibling am-fs-core repo used to satisfy the path dep
  # during local build/verify. `chore siblings` is the copy that matters
  # (chores.yml pins FS_CORE_REF there, and CI reads it through the task);
  # this one is for the publish job below, which clones by hand because it
  # needs nothing else chore provides. Bump the two in lockstep with the
  # am-fs-core version constraint in Cargo.toml.
  FS_CORE_REF: v0.2.10

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: install chore
        run: scripts/ci-install-chore.sh

      - name: chore siblings
        run: chore siblings

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # THE RELEASE GATE IS THE SAME GATE, through the same tasks. It
      # used to install btrfs-progs on the runner and build the fixtures
      # there; both now happen inside the fs-linux-test-harness VM, so a
      # tag is checked against exactly the tooling a pull request was,
      # rather than against whatever this runner image ships. See the
      # test contract at the top of chores.yml.
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh

      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}

      # What the HOST needs, which is NOT btrfs-progs: ripgrep for the
      # script tests, and the VM the oracle tools live in.
      - name: chore tools
        run: chore tools

      # Without the fixtures the oracles have nothing to compare against,
      # and they FAIL rather than skip — so a tag cannot ship on the
      # strength of self-consistency alone, which is what the old
      # arrangement allowed.
      - name: chore fixtures
        run: chore fixtures

      - name: chore lint
        run: chore lint

      - name: chore test
        run: chore test

      - name: chore vm:status (the VM is down again)
        run: '! chore vm:status'

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `am-fs-core` path
        # dependency into its registry equivalent in the packaged
        # lockfile, which `--locked` forbids ("cannot update the lock
        # file"). The verify-build resolves am-fs-core from crates.io via
        # the `version` constraint, so the published artifact is pinned by
        # that constraint, not by the local path checkout.
        run: cargo publish
