name: explore-177 (temporary)
on:
  push:
    branches: ['fix/177-*']
jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-install-chore.sh
      - run: chore siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs >/dev/null
      - run: cargo build --locked --release --example explore177
      - run: bash scripts/explore177/run.sh
