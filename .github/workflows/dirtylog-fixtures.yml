name: Kernel-made dirty-log fixtures

# The focused producer route for the dirty-log fixtures (#266): it builds
# only the `dirtylog` target in the harness VM, so a change to how those
# images are made gets the native dump's verdict without the whole
# pipeline. Every producer assertion still runs; this proves the images
# and their transcripts, not replay, which the full pipeline still owns.
on:
  pull_request:
    paths:
      - test-disks/guest-build-images.sh
      - .github/workflows/dirtylog-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CHORE_VERSION: "0.11.0"
  # The shared guest's size, not the harness's `low` resource profile (2G,
  # 2 CPUs on GitHub Actions). The kernel-made volumes these tests build
  # depend on it: with 2G, tests/full_backref_move.rs's balanced volume kept
  # its free-space records across two leaves and every candidate leaf was
  # passed over (merge-queue run 44873389372), where 4G and 4 CPUs, the size
  # this suite was validated on before harness v0.7.0, pass.
  FLTH_SHARED_MEMORY: 4G
  FLTH_SHARED_CPUS: "4"

jobs:
  dirtylog-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64-kvm

  dirtylog:
    name: dirtylog fixtures (harness VM, x86_64 KVM)
    needs: dirtylog-gate
    runs-on: ${{ needs.dirtylog-gate.outputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Packages the hosted image has
        if: runner.environment == 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl jq
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Upstream virtiofsd 1.14.0
        # Ubuntu 24.04 packages virtiofsd 1.10.0, which never answers a
        # non-UTF-8 xattr name (tests/getxattr_byte_names.rs hung, #794).
        # The tag must match LINUX_HARNESS_REF in chores.yml.
        uses: antimatter-studios/fs-linux-test-harness/.github/actions/install-virtiofsd@v0.10.0
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: Build the dirtylog target only
        run: test-disks/build-fixtures.sh dirtylog
      - name: Stop the shared guest (no run is still using it)
        # The shared guest stays up after a run (harness v0.7.0). `vm:down`
        # stops it only when no suite is using it, so a guest still up
        # afterwards means a run leaked its session.
        if: always()
        run: ../fs-linux-test-harness/scripts/vm.sh down && ! chore vm:status
      - name: Keep the native transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirtylog-transcripts
          path: test-disks/dirtylog/*.logdump
          if-no-files-found: warn
